---
- name: "Chrony - install"
  ansible.builtin.apt:
    name: chrony
    state: present

- name: "Chrony - deploy ANSSI configuration"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: "Chrony - enable and start"
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
