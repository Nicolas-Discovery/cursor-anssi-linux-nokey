---
# Disable Ctrl-Alt-Del reboot at runtime (R8 console hardening)
- name: "Services - mask ctrl-alt-del.target"
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true

- name: "Services - mask debug-shell.service"
  ansible.builtin.systemd:
    name: debug-shell.service
    masked: true
    enabled: false
  failed_when: false

- name: "Services - disable kdump if installed"
  ansible.builtin.systemd:
    name: kdump-tools.service
    enabled: false
    state: stopped
  failed_when: false

- name: "Journald - ensure drop-in directory exists"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Journald - deploy hardened config"
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/00-anssi.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
