---
- name: "Kernel - blacklist unused / dangerous modules"
  ansible.builtin.template:
    src: modprobe-anssi-blacklist.conf.j2
    dest: /etc/modprobe.d/anssi-blacklist.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update initramfs

- name: "Kernel - module loading policy is via modprobe blacklist (not sysctl modules_disabled)"
  ansible.builtin.debug:
    msg: >-
      kernel.modules_disabled is not applied via sysctl: runtime writes often
      fail with EINVAL under lockdown=confidentiality / hardened kernels and
      abort `sysctl --system`. Use modprobe blacklist (this role) for ANSSI
      R6/R7; set modules_disabled=1 only on purpose-built appliances.
  changed_when: false
