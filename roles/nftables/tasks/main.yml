---
- name: "Nftables - install"
  ansible.builtin.apt:
    name:
      - nftables
      - python3-requests
      - python3-yaml
      - awscli
    state: present

- name: "Nftables - directories for GeoIP cache + generated includes"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ nftables.geoip.cache_dir }}"
    - /etc/nftables.d
    - /var/lib/anssi-nftables

- name: "Nftables - install the GeoIP refresher script"
  ansible.builtin.copy:
    src: anssi-geoip-update.py
    dest: /usr/local/sbin/anssi-geoip-update
    owner: root
    group: root
    mode: "0750"

- name: "Nftables - install the static IP whitelist/blacklist include"
  ansible.builtin.template:
    src: nft-include-static.conf.j2
    dest: /etc/nftables.d/10-static.conf
    owner: root
    group: root
    mode: "0640"
  notify: Reload nftables

- name: "Nftables - install the GeoIP runtime config (consumed by the script)"
  ansible.builtin.template:
    src: anssi-geoip.yaml.j2
    dest: /etc/anssi-geoip.yaml
    owner: root
    group: root
    mode: "0640"

- name: "Nftables - run the GeoIP refresher once now to populate the sets"
  ansible.builtin.command: /usr/local/sbin/anssi-geoip-update --apply
  when: nftables.geoip.enabled | bool
  changed_when: true
  register: nftables_geoip_run
  failed_when:
    - nftables_geoip_run.rc != 0
    - "'no network' not in (nftables_geoip_run.stderr | default(''))"

- name: "Nftables - install the systemd refresher unit"
  ansible.builtin.template:
    src: anssi-geoip-update.service.j2
    dest: /etc/systemd/system/anssi-geoip-update.service
    owner: root
    group: root
    mode: "0644"

- name: "Nftables - install the systemd refresher timer"
  ansible.builtin.template:
    src: anssi-geoip-update.timer.j2
    dest: /etc/systemd/system/anssi-geoip-update.timer
    owner: root
    group: root
    mode: "0644"

- name: "Nftables - enable the refresher timer"
  ansible.builtin.systemd:
    name: anssi-geoip-update.timer
    enabled: true
    state: started
    daemon_reload: true
  when: nftables.geoip.enabled | bool

# --- S3-backed whitelist refresher (optional, every N minutes) ---------------
- name: "Nftables - install the S3 whitelist refresher script"
  ansible.builtin.copy:
    src: anssi-s3-whitelist-update.py
    dest: /usr/local/sbin/anssi-s3-whitelist-update
    owner: root
    group: root
    mode: "0750"
  when: nftables.s3_whitelist.enabled | default(false) | bool

- name: "Nftables - deploy the S3 whitelist runtime config"
  ansible.builtin.template:
    src: anssi-s3-whitelist.yaml.j2
    dest: /etc/anssi-s3-whitelist.yaml
    owner: root
    group: root
    mode: "0640"
  when: nftables.s3_whitelist.enabled | default(false) | bool

- name: "Nftables - deploy the S3 whitelist environment file (AWS credentials)"
  ansible.builtin.template:
    src: anssi-s3-whitelist.env.j2
    dest: /etc/anssi-s3-whitelist.env
    owner: root
    group: root
    mode: "0600"
  when: nftables.s3_whitelist.enabled | default(false) | bool
  no_log: true

- name: "Nftables - install S3 whitelist systemd service"
  ansible.builtin.template:
    src: anssi-s3-whitelist-update.service.j2
    dest: /etc/systemd/system/anssi-s3-whitelist-update.service
    owner: root
    group: root
    mode: "0644"
  when: nftables.s3_whitelist.enabled | default(false) | bool
  notify: Reload systemd daemons

- name: "Nftables - install S3 whitelist systemd timer (every N minutes)"
  ansible.builtin.template:
    src: anssi-s3-whitelist-update.timer.j2
    dest: /etc/systemd/system/anssi-s3-whitelist-update.timer
    owner: root
    group: root
    mode: "0644"
  when: nftables.s3_whitelist.enabled | default(false) | bool
  notify: Reload systemd daemons

- name: "Nftables - ensure the dynamic S3 include exists (empty sets bootstrap)"
  ansible.builtin.copy:
    dest: /etc/nftables.d/15-s3-whitelist.conf
    owner: root
    group: root
    mode: "0640"
    force: false
    content: |
      # Bootstrap placeholder (managed by /usr/local/sbin/anssi-s3-whitelist-update).
      set s3_whitelist_v4 { type ipv4_addr; flags interval; auto-merge; }
      set s3_whitelist_v6 { type ipv6_addr; flags interval; auto-merge; }
  when: nftables.s3_whitelist.enabled | default(false) | bool

- name: "Nftables - enable and start the S3 whitelist timer"
  ansible.builtin.systemd:
    name: anssi-s3-whitelist-update.timer
    enabled: true
    state: started
    daemon_reload: true
  when: nftables.s3_whitelist.enabled | default(false) | bool

- name: "Nftables - run the S3 whitelist refresher once now (bootstrap)"
  ansible.builtin.command: /usr/local/sbin/anssi-s3-whitelist-update --apply
  when:
    - nftables.s3_whitelist.enabled | default(false) | bool
    - nftables.s3_whitelist.run_now | default(true) | bool
  register: nftables_s3_run
  changed_when: true
  failed_when:
    - nftables_s3_run.rc != 0
    - nftables.s3_whitelist.fail_on_bootstrap_error | default(false) | bool

- name: "Nftables - deploy the master ruleset"
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0640"
    validate: "nft -c -f %s"
  notify: Reload nftables

- name: "Nftables - enable and start the service"
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
