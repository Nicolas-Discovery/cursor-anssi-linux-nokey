---
# These pins are intentionally narrow:
#   * ansible.posix 2.x requires ansible-core >= 2.16 and drops support for
#     older controllers; we cap to 1.x so the stack still installs cleanly
#     on ansible-core 2.14/2.15 (warning-free) while remaining usable on
#     ansible-core 2.16/2.17.
#   * community.general 12.0.0 removed the `community.general.yaml`
#     callback and dropped support for older controllers; we cap to 9.x
#     so both the callbacks we rely on and ansible-core 2.14+ remain
#     supported. The `result_format = yaml` option of ansible.builtin.default
#     (set in ansible.cfg) supersedes the removed `yaml` callback anyway.
collections:
  - name: ansible.posix
    version: ">=1.5.4,<2.0.0"
  - name: community.general
    version: ">=8.0.0,<10.0.0"
