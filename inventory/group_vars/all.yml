---
# =============================================================================
# ANSSI BP-028 v2.0 - Critical environment - Single source of truth
# =============================================================================
# This file groups EVERY tunable for the whole stack:
#   - tool versions
#   - feature toggles
#   - hardening parameters
#   - firewall / GeoIP policy
#   - CrowdSec enrolment & whitelist
#   - Docker hardening
#   - Loki / Wazuh export
#
# Override per host or per group through inventory or ansible-vault, but keep
# this file as the canonical reference.
# Reference document: ANSSI-BP-028 v2.0 - "Recommandations de configuration
# d'un système GNU/Linux" - profile "Élevé / Critique".
# =============================================================================


# -----------------------------------------------------------------------------
# 0. PROFILE
# -----------------------------------------------------------------------------
# Hardening profile applied throughout the stack. Possible values:
#   minimal | intermediate | enhanced | high
# This stack always assumes "high" (équivalent ANSSI "élevé/critique").
anssi_profile: "high"

# Target Linux distribution. Only Debian 13 (Trixie) is officially supported.
target_distribution: "Debian"
target_distribution_release: "trixie"
target_distribution_major: "13"


# -----------------------------------------------------------------------------
# 1. ROLE TOGGLES (which optional roles to apply)
# -----------------------------------------------------------------------------
role_anssi_base_enabled: true
role_nftables_enabled: true
role_crowdsec_enabled: false
role_docker_enabled: false
role_loki_enabled: false
role_wazuh_enabled: false


# -----------------------------------------------------------------------------
# 2. PINNED VERSIONS (single place to update tooling versions)
# -----------------------------------------------------------------------------
versions:
  # APT package versions: "latest" or a specific apt version string.
  # On Debian Trixie default repos already match these tools.
  auditd: "latest"
  apparmor: "latest"
  rsyslog: "latest"
  chrony: "latest"
  unattended_upgrades: "latest"
  libpam_pwquality: "latest"
  libpam_google_authenticator: "latest"
  nftables: "latest"

  # CrowdSec - upstream APT repo, pinned major.
  crowdsec: "1.6.*"
  crowdsec_firewall_bouncer: "0.0.*"

  # Docker (Docker CE upstream repo).
  docker_ce: "5:27.*"
  docker_compose_plugin: "2.*"

  # Grafana Loki agent.
  promtail: "3.2.1"

  # Wazuh agent (Wazuh upstream APT repo).
  wazuh_agent: "4.9.*"


# -----------------------------------------------------------------------------
# 3. ANSSI BASE ROLE
# -----------------------------------------------------------------------------
anssi_base:

  # ---- 3.1 Packages ------------------------------------------------------------
  # Mandatory baseline (R1 - minimum software footprint).
  required_packages:
    - apparmor
    - apparmor-profiles
    - apparmor-profiles-extra
    - apparmor-utils
    - apt-listbugs
    - apt-listchanges
    - auditd
    - audispd-plugins
    - chrony
    - cron
    - debsums
    - libpam-pwquality
    - libpam-tmpdir
    - libpam-google-authenticator
    - lsb-release
    - needrestart
    - nftables
    - openssh-server
    - python3-debian
    - rkhunter
    - rsyslog
    - sudo
    - systemd-journal-remote
    - unattended-upgrades

  # Banned (R3-R62): non-essentielles ou risquées pour un serveur "élevé".
  forbidden_packages:
    - avahi-daemon
    - cups
    - exim4
    - postfix
    - rpcbind
    - rsh-client
    - rsh-redone-client
    - sendmail
    - snmpd
    - talk
    - telnet
    - tftpd
    - whoopsie
    - xinetd
    - ypbind

  # ---- 3.2 Kernel & sysctl (R8/R9 + sect. 4 réseau) ----------------------------
  # Sysctl is split into kernel/network/IPv6 to keep readability.
  sysctl_kernel:
    kernel.kptr_restrict: 2
    kernel.dmesg_restrict: 1
    kernel.printk: "3 4 1 3"
    kernel.kexec_load_disabled: 1
    kernel.sysrq: 0
    kernel.unprivileged_bpf_disabled: 1
    kernel.unprivileged_userns_clone: 0
    kernel.perf_event_paranoid: 3
    kernel.yama.ptrace_scope: 2
    kernel.randomize_va_space: 2
    kernel.core_uses_pid: 1
    # kernel.modules_disabled is deliberately NOT set here: on kernels with
    # lockdown=confidentiality (see GRUB cmdline) or other policies, writing
    # this sysctl fails with EINVAL and breaks `sysctl --system`. ANSSI R6/R7
    # is enforced via modprobe blacklist instead; use modules_disabled=1 only
    # on dedicated appliances where you accept a reboot to undo.
    kernel.panic_on_oops: 1
    fs.suid_dumpable: 0
    fs.protected_fifos: 2
    fs.protected_regular: 2
    fs.protected_symlinks: 1
    fs.protected_hardlinks: 1
    net.core.bpf_jit_harden: 2

  sysctl_ipv4:
    net.ipv4.ip_forward: 0
    net.ipv4.conf.all.accept_redirects: 0
    net.ipv4.conf.default.accept_redirects: 0
    net.ipv4.conf.all.secure_redirects: 0
    net.ipv4.conf.default.secure_redirects: 0
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.default.send_redirects: 0
    net.ipv4.conf.all.accept_source_route: 0
    net.ipv4.conf.default.accept_source_route: 0
    net.ipv4.conf.all.rp_filter: 1
    net.ipv4.conf.default.rp_filter: 1
    net.ipv4.conf.all.log_martians: 1
    net.ipv4.conf.default.log_martians: 1
    net.ipv4.icmp_echo_ignore_broadcasts: 1
    net.ipv4.icmp_ignore_bogus_error_responses: 1
    net.ipv4.tcp_syncookies: 1
    net.ipv4.tcp_rfc1337: 1
    net.ipv4.tcp_timestamps: 0
    net.ipv4.conf.all.arp_ignore: 2
    net.ipv4.conf.all.arp_announce: 2
    net.ipv4.conf.all.shared_media: 0
    net.ipv4.conf.default.shared_media: 0
    net.ipv4.conf.all.accept_local: 0
    net.ipv4.conf.all.route_localnet: 0
    net.ipv4.conf.all.drop_gratuitous_arp: 1

  # IPv6 stays enabled (requirement) but is hardened.
  sysctl_ipv6:
    net.ipv6.conf.all.disable_ipv6: 0
    net.ipv6.conf.default.disable_ipv6: 0
    net.ipv6.conf.all.forwarding: 0
    net.ipv6.conf.default.forwarding: 0
    net.ipv6.conf.all.accept_ra: 0
    net.ipv6.conf.default.accept_ra: 0
    net.ipv6.conf.all.accept_redirects: 0
    net.ipv6.conf.default.accept_redirects: 0
    net.ipv6.conf.all.accept_source_route: 0
    net.ipv6.conf.default.accept_source_route: 0
    net.ipv6.conf.all.use_tempaddr: 2
    net.ipv6.conf.default.use_tempaddr: 2
    net.ipv6.conf.all.router_solicitations: 0
    net.ipv6.conf.default.router_solicitations: 0

  # ---- 3.3 Kernel module blacklist (R6 / R7 / annexe B) ------------------------
  blacklisted_modules:
    - cramfs
    - freevxfs
    - jffs2
    - hfs
    - hfsplus
    - squashfs
    - udf
    - usb-storage
    - dccp
    - sctp
    - rds
    - tipc
    - n-hdlc
    - ax25
    - netrom
    - x25
    - rose
    - decnet
    - econet
    - af_802154
    - ipx
    - appletalk
    - psnap
    - p8023
    - p8022
    - can
    - atm
    - bluetooth
    - firewire-core
    - thunderbolt

  # ---- 3.4 Boot loader (R5 / R11) ---------------------------------------------
  # GRUB 2 is locked down. Set grub_password to an encrypted PBKDF2 string
  # generated with `grub-mkpasswd-pbkdf2`. Leave empty to skip.
  grub_password_pbkdf2: ""
  grub_superuser: "anssi-grub-admin"
  grub_cmdline_extra:
    - "page_alloc.shuffle=1"
    - "slab_nomerge"
    - "init_on_alloc=1"
    - "init_on_free=1"
    - "vsyscall=none"
    - "lockdown=confidentiality"
    - "loglevel=0"
    - "audit=1"
    - "audit_backlog_limit=8192"

  # ---- 3.5 Filesystem mount hardening (R28-R32) -------------------------------
  # Enforce strict options on standard mount points if they are separate
  # filesystems. Lines are skipped if the mount point is not a dedicated FS.
  fstab_hardening:
    - { mount: "/tmp",          options: "defaults,nodev,nosuid,noexec,rw" }
    - { mount: "/var/tmp",      options: "defaults,nodev,nosuid,noexec,rw" }
    - { mount: "/dev/shm",      options: "defaults,nodev,nosuid,noexec,rw" }
    - { mount: "/home",         options: "defaults,nodev,nosuid,rw" }
    - { mount: "/var",          options: "defaults,nodev,nosuid,rw" }
    - { mount: "/var/log",      options: "defaults,nodev,nosuid,noexec,rw" }
    - { mount: "/var/log/audit", options: "defaults,nodev,nosuid,noexec,rw" }
    - { mount: "/proc",         options: "defaults,hidepid=2" }

  # ---- 3.6 PAM / passwords (R31, R68-R70) -------------------------------------
  pam:
    pwquality:
      minlen: 14
      dcredit: -1
      ucredit: -1
      lcredit: -1
      ocredit: -1
      minclass: 4
      maxrepeat: 3
      maxclassrepeat: 3
      gecoscheck: 1
      dictcheck: 1
      enforce_for_root: true
      retry: 3
      difok: 5
      remember: 12
    faillock:
      deny: 5
      unlock_time: 1800
      fail_interval: 900
      even_deny_root: false
      audit: true
    login_defs:
      pass_max_days: 90
      pass_min_days: 1
      pass_warn_age: 14
      login_retries: 3
      login_timeout: 60
      umask: "0027"
      sha_crypt_min_rounds: 65536
      sha_crypt_max_rounds: 65536
      encrypt_method: "YESCRYPT"

  # ---- 3.7 SSH (R55-R63) and password + 2FA -----------------------------------
  # Key-based auth is intentionally DISABLED, the user wants password + TOTP.
  ssh:
    port: 22
    listen_addresses:
      - "0.0.0.0"
      - "::"
    permit_root_login: "no"
    password_authentication: true            # required: password is the 1st factor
    pubkey_authentication: false             # explicit: NO key-based auth
    kbd_interactive_authentication: true     # 2nd factor via PAM (TOTP)
    challenge_response_authentication: true  # legacy alias kept for safety
    use_pam: true
    authentication_methods: "keyboard-interactive"
    permit_empty_passwords: false
    x11_forwarding: false
    allow_tcp_forwarding: false
    allow_agent_forwarding: false
    permit_user_environment: false
    max_auth_tries: 3
    # Ansible + SSH multiplexing can use several multiplexed sessions on one
    # TCP connection; stay at or above OpenSSH default (10) to avoid subtle
    # 'Connection reset' / 'channel open' failures during large playbooks.
    max_sessions: 10
    # Unauthenticated connection burst limit: Ansible without multiplexing
    # spawns one NEW TCP per task — default 10:30:100 drops excess with TCP RST
    # (often logged as kex_exchange_identification reset). Raising this keeps
    # first-run automation reliable; tune down after baseline if desired.
    max_startups: "100:30:400"
    login_grace_time: 30
    client_alive_interval: 300
    client_alive_count_max: 0
    log_level: "VERBOSE"
    use_dns: false
    strict_modes: true
    ignore_rhosts: true
    hostbased_authentication: false
    print_motd: false
    banner: "/etc/issue.net"
    allow_groups:
      - "ssh-users"
    # If you use only AllowGroups (default) and do NOT set allow_from_any_address
    # nor user_allow_from_addresses below, AllowUsers is omitted (any member of
    # allow_groups may connect from anywhere subject to nftables).
    allow_users: []
    # When either list below is non-empty, sshd sets AllowUsers with patterns
    # user@CIDR (see sshd_config(5)); EVERY account that must SSH in must be
    # listed — typically ansadmin@* plus per-user CIDR rows.
    allow_from_any_address:
      - ansadmin
    user_allow_from_addresses:
      superbis:
        - "10.0.0.0/8"                 # REPLACE: IPv4 CIDRs allowed for user superbis
        - "[2001:db8:1000::]/64" 
        - "90.63.184.91"
        - "5.196.62.22"
        - "2a01:cb04:24f:42::/56"
        - "2001:41d0:203:61a0::1:6"
    # PAM skips google_authenticator for these accounts (password only over SSH).
    totp_exempt_users:
      - superbis
    deny_users:
      - "root"
    # Hardened crypto (R56 / R57).
    kex_algorithms:
      - "sntrup761x25519-sha512@openssh.com"
      - "curve25519-sha256"
      - "curve25519-sha256@libssh.org"
      - "diffie-hellman-group16-sha512"
      - "diffie-hellman-group18-sha512"
    ciphers:
      - "chacha20-poly1305@openssh.com"
      - "aes256-gcm@openssh.com"
      - "aes256-ctr"
    macs:
      - "hmac-sha2-512-etm@openssh.com"
      - "hmac-sha2-256-etm@openssh.com"
    host_key_algorithms:
      - "ssh-ed25519"
      - "rsa-sha2-512"
      - "rsa-sha2-256"

  # 2FA / TOTP (Google Authenticator PAM module).
  # Provision a secret for each account in enforced_users (not in totp_exempt_users),
  # run ON THE HOST as that Linux user, BEFORE enforcing this playbook:
  #
  #   google-authenticator -t -d -f -r 3 30 -W -e 5 -i "ANSSI-CRITICAL"
  #   chmod 0400 ~/.google_authenticator
  #
  # (-r 3 30 must match anssi_base.twofa.rate_limit; -i matches twofa.issuer.)
  twofa:
    enabled: true
    enforce_on_console: false        # only enforce TOTP on remote SSH
    issuer: "ANSSI-CRITICAL"
    rate_limit: "3 30"               # 3 attempts every 30 seconds
    window_size: 3
    nullok: false                    # critical => TOTP MANDATORY
    grace_period_first_login: false  # provisioning must be done before applying
    # Local users that MUST have a TOTP secret provisioned.
    enforced_users:
      - "ansadmin"

  # ---- 3.8 Local users (R30-R34) ----------------------------------------------
  # Operations group used by SSH + sudo. Only provision a non-root admin.
  admin_group: "ssh-users"
  admin_users:
    - name: "ansadmin"
      comment: "ANSSI break-glass admin"
      uid: 1500
      shell: "/bin/bash"
      groups: ["sudo", "adm", "ssh-users"]
      # Password must be provided via Ansible Vault as 'ansadmin_password_hash'
      # (yescrypt or sha512crypt). Empty => account stays locked.
      password_hash_var: "ansadmin_password_hash"
  # Existing local accounts (already on the host) appended to admin_group so
  # AllowGroups ssh-users matches. Does NOT create the user or set password.
  existing_users_add_to_ssh_group:
    - superbis
  lock_root_account: true
  disable_root_login: true

  # ---- 3.9 Sudo (R59) ----------------------------------------------------------
  sudo:
    require_password: true
    timeout: 5
    log_file: "/var/log/sudo.log"
    use_pty: true
    secure_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

  # ---- 3.10 auditd (R72) -------------------------------------------------------
  auditd:
    max_log_file: 200          # MB
    num_logs: 10
    space_left: 75
    admin_space_left: 50
    disk_full_action: "halt"
    disk_error_action: "halt"
    space_left_action: "email"
    action_mail_acct: "root"
    flush: "incremental_async"
    freq: 50
    name_format: "hostname"

  # ---- 3.11 Logging / journald -------------------------------------------------
  journald:
    storage: "persistent"
    compress: true
    forward_to_syslog: true
    seal: true
    max_use: "2G"
    max_file_sec: "1month"
    max_retention_sec: "1year"

  # ---- 3.12 Time / NTP (R20) ---------------------------------------------------
  chrony_servers:
    - "0.fr.pool.ntp.org iburst"
    - "1.fr.pool.ntp.org iburst"
    - "2.fr.pool.ntp.org iburst"
    - "3.fr.pool.ntp.org iburst"

  # ---- 3.13 Unattended upgrades ------------------------------------------------
  unattended_upgrades:
    enabled: true
    automatic_reboot: false
    automatic_reboot_time: "03:00"
    allowed_origins:
      - "${distro_id}:${distro_codename}"
      - "${distro_id}:${distro_codename}-security"
      - "${distro_id}ESMApps:${distro_codename}-apps-security"

  # ---- 3.14 AppArmor & Yama ----------------------------------------------------
  apparmor_enabled: true
  yama_ptrace_scope: 2

  # ---- 3.15 Banner -------------------------------------------------------------
  banner_text: |
    ************************************************************************
    *                                                                      *
    *  ATTENTION - Système de production - Accès restreint                 *
    *  Toute connexion non autorisée est interdite et fera l'objet         *
    *  de poursuites (Code Pénal art. 323-1 à 323-7).                      *
    *  Toute action est journalisée et susceptible d'être analysée.        *
    *                                                                      *
    *  WARNING - Authorised personnel only - Activity is logged.           *
    *                                                                      *
    ************************************************************************


# -----------------------------------------------------------------------------
# 4. NFTABLES / GEOIP ROLE
# -----------------------------------------------------------------------------
nftables:

  # Default policy on input chain. "drop" is the ANSSI baseline.
  default_policy_input: "drop"
  default_policy_forward: "drop"
  default_policy_output: "accept"

  # Allow ICMP (ping, PMTUD, NDP). Disabling NDP breaks IPv6.
  allow_icmpv4: true
  allow_icmpv6: true

  # Services to expose. Each item: { proto, port, comment }.
  # Example below opens SSH (22). Add more as needed.
  allowed_services:
    - { proto: "tcp", port: 22, comment: "SSH" }

  # ---- 4.1 GeoIP policy --------------------------------------------------------
  geoip:
    enabled: true
    # Source of per-country IP zone files. ipdeny.com is the default because
    # it is free and offers both IPv4 and IPv6 daily-updated CIDRs.
    provider: "ipdeny"
    base_url_v4: "https://www.ipdeny.com/ipblocks/data/aggregated"
    base_url_v6: "https://www.ipdeny.com/ipv6/ipv6addresses/aggregated"
    refresh_interval: "daily"
    cache_dir: "/var/cache/anssi-geoip"

    # Continents whose CIDRs are ALLOWED. Everything else is dropped.
    # Continent codes: AF, AN, AS, EU, NA, OC, SA.
    # "EU" means the Europe continent (ipdeny convention), not the political EU.
    allowed_continents:
      - "EU"

    # Extra countries to ALLOW even if their continent is not in the list above.
    # Use ISO-3166-1 alpha-2 codes in lower case (ipdeny convention).
    # Example: GB (United Kingdom - left the EU) is added by default.
    allowed_countries:
      - "gb"

    # Countries to BLOCK explicitly, even when their continent is allowed.
    # Example: Russia (ru) is geographically partly in Europe but must be blocked.
    blocked_countries:
      - "ru"
      - "by"

  # ---- 4.2 Static IP whitelist / blacklist -------------------------------------
  # Always-allow list (bypasses GeoIP, but NOT the blacklist).
  ip_whitelist_v4:
    - "127.0.0.0/8"
    - "90.63.184.91/32"
    - "5.196.62.22/32"
  # - "203.0.113.10/32"   # bastion
  ip_whitelist_v6:
    - "::1/128"
    - "2a01:cb04:24f:42::/56"
    - "2001:41d0:203:61a0::1:6/128"
  # - "2001:db8::1/128"   # bastion v6

  # Always-drop list (highest priority, applied before whitelist).
  ip_blacklist_v4: []
  ip_blacklist_v6: []

  # Networks that may RECEIVE outbound from the host (rate-limited otherwise).
  trusted_management_v4:
    - "10.0.0.0/8"
    - "192.168.0.0/16"
    - "90.63.184.91/32"
    - "5.196.62.22/32"
  trusted_management_v6:
    - "fc00::/7"
    - "2a01:cb04:24f:42::/56"
    - "2001:41d0:203:61a0::1:6/128"


# -----------------------------------------------------------------------------
# 5. CROWDSEC ROLE
# -----------------------------------------------------------------------------
crowdsec:

  # APT repo (CrowdSec official packagecloud).
  repo_url: "https://packagecloud.io/crowdsec/crowdsec/debian"

  # Hub collections to install on this node.
  collections:
    - "crowdsecurity/linux"
    - "crowdsecurity/sshd"
    - "crowdsecurity/iptables"
    - "crowdsecurity/base-http-scenarios"
    - "crowdsecurity/whitelist-good-actors"

  # Parsers (geoip-enrich is mandatory for continent-based decisions).
  parsers:
    - "crowdsecurity/geoip-enrich"
    - "crowdsecurity/whitelists"

  # Bouncer = nftables, integrated with the firewall role.
  install_firewall_bouncer: true
  firewall_bouncer_mode: "nftables"     # nftables | iptables
  firewall_bouncer_ipv6: true

  # ---- 5.1 Console enrolment (the "registration variable") ---------------------
  # Enrolment token from https://app.crowdsec.net/ (Security Engines > Enroll).
  # Provide via Ansible Vault (recommended) under the variable name below, or
  # leave empty to skip enrolment.
  enroll_enabled: true
  enroll_token: "{{ crowdsec_enroll_token | default('') }}"
  enroll_name: "{{ inventory_hostname }}"
  enroll_overwrite: false
  enroll_tags:
    - "anssi"
    - "critical"
    - "debian13"

  # ---- 5.2 Whitelist (CrowdSec parser-level whitelist) -------------------------
  # IPs/CIDRs that CrowdSec will NEVER take a decision against. Independent of
  # the nftables whitelist, applied before scenarios trigger.
  whitelist:
    reason: "anssi-trusted-sources"
    ips: []
    cidrs:
      - "127.0.0.1/32"
      - "::1/128"
      - "90.63.184.91/32"
      - "5.196.62.22/32"
      - "2a01:cb04:24f:42::/56"
      - "2001:41d0:203:61a0::1:6/128"
      # - "10.0.0.0/8"
    expression: []   # advanced CEL whitelist expressions

  # ---- 5.3 Continent / country profile -----------------------------------------
  # Mirrors the nftables policy at the application layer (CrowdSec scenarios).
  # When true, CrowdSec will pre-emptively ban any source whose continent is NOT
  # in nftables.geoip.allowed_continents or country in allowed_countries.
  geoip_profile_enabled: true
  geoip_decision_duration: "168h"
  geoip_decision_type: "ban"


# -----------------------------------------------------------------------------
# 6. DOCKER ROLE (optional, hardened, IPv6 disabled by request)
# -----------------------------------------------------------------------------
docker:
  channel: "stable"           # stable | test
  install_compose_plugin: true
  data_root: "/var/lib/docker"

  daemon:
    # IPv6 explicitly disabled at the Docker daemon level (per requirement).
    ipv6: false
    ip6tables: false
    fixed_cidr_v6: ""
    # Hardening defaults (CIS Docker Benchmark + ANSSI guidance).
    icc: false
    userland_proxy: false
    no_new_privileges: true
    live_restore: true
    log_driver: "json-file"
    log_opts:
      max-size: "10m"
      max-file: "5"
      labels: "service,environment"
    storage_driver: "overlay2"
    default_ulimits:
      nofile:
        Name: "nofile"
        Hard: 64000
        Soft: 64000
    seccomp_profile: "/etc/docker/seccomp-default.json"
    # User-namespace remap to break container-root <-> host-root equivalence.
    userns_remap: "default"
    # Restrict insecure / experimental features.
    experimental: false
    selinux_enabled: false
    tls: true
    tlsverify: true
    # MTU/bridge tuned for hosts behind a hardened firewall.
    mtu: 1500
    bridge: "none"           # custom networks only, no default bridge

  # Privileges of users allowed to call docker without sudo. Keep empty for
  # critical environments (require sudo every time).
  docker_admin_users: []


# -----------------------------------------------------------------------------
# 7. LOKI / PROMTAIL ROLE (optional, log shipping)
# -----------------------------------------------------------------------------
loki:
  # Promtail binary download.
  binary_url: "https://github.com/grafana/loki/releases/download/v{{ versions.promtail }}/promtail-linux-amd64.zip"
  binary_sha256: ""           # set to a known good hash for production
  install_dir: "/usr/local/bin"
  config_dir: "/etc/promtail"
  positions_file: "/var/lib/promtail/positions.yaml"

  # Central Loki endpoint. Use HTTPS + basic auth + tenant header.
  url: "https://loki.example.org/loki/api/v1/push"
  tenant_id: "anssi-critical"
  basic_auth:
    username: "promtail"
    password: "{{ loki_basic_auth_password | default('') }}"
  tls:
    ca_file: "/etc/ssl/certs/ca-certificates.crt"
    insecure_skip_verify: false

  # Static labels attached to every log line shipped from this host.
  external_labels:
    job: "system"
    env: "critical"
    distro: "debian13"

  # Files / units to scrape (in addition to journald).
  scrape_configs:
    - job_name: "journal"
      type: "journal"
      max_age: "12h"
      labels: { job: "systemd-journal" }
    - job_name: "auth"
      type: "file"
      paths:
        - "/var/log/auth.log"
      labels: { job: "auth" }
    - job_name: "audit"
      type: "file"
      paths:
        - "/var/log/audit/audit.log"
      labels: { job: "audit" }


# -----------------------------------------------------------------------------
# 8. WAZUH AGENT ROLE (optional, central SIEM)
# -----------------------------------------------------------------------------
wazuh:
  repo_url: "https://packages.wazuh.com/4.x/apt/"
  repo_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"

  # Wazuh manager(s) the agent must register with.
  manager_address: "wazuh.example.org"
  manager_port: 1514
  manager_protocol: "tcp"

  # Registration credentials (use authd). Provide the password via Vault.
  enrollment:
    enabled: true
    use_password: true
    password: "{{ wazuh_enrollment_password | default('') }}"
    agent_name: "{{ inventory_hostname }}"
    groups:
      - "anssi"
      - "debian13"
      - "critical"

  # Agent local options.
  agent_config:
    log_format: "json"
    enable_syscheck: true
    enable_rootcheck: true
    enable_sca: true
    enable_logcollector: true
    notify_time: 60
    time_reconnect: 60
    auto_restart: true
