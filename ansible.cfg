[defaults]
# Inventory + roles paths
inventory          = inventory/hosts.yml
roles_path         = roles
collections_path   = collections
host_key_checking  = True
nocows             = 1
forks              = 10
# `community.general.yaml` was removed in community.general 12.0.0.
# Use the built-in `default` callback (ansible-core >= 2.13) with
# `callback_result_format = yaml` to obtain the same YAML-formatted output.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
callback_format_pretty = true
callbacks_enabled      = ansible.posix.profile_tasks,ansible.posix.timer
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout    = 7200
retry_files_enabled = False
deprecation_warnings = True
interpreter_python  = auto_silent

# Password + TOTP authentication: never assume any local key.
private_key_file =

[privilege_escalation]
become             = True
become_method      = sudo
become_ask_pass    = True

[ssh_connection]
# Two-factor SSH (password + TOTP) does NOT survive ControlMaster reuse:
# disable persistent connections so each task triggers a full PAM exchange.
pipelining       = False
ssh_args         = -o PreferredAuthentications=keyboard-interactive,password -o PubkeyAuthentication=no -o ControlMaster=no -o ServerAliveInterval=30
control_path     = none
retries          = 1
