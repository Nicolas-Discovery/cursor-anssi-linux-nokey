[defaults]
# Targets ansible-core >= 2.16 (LTS line) on the controller.
# See controller-requirements.txt and requirements.yml for pinned versions.

# --- Inventory + roles --------------------------------------------------------
inventory          = inventory/hosts.yml
roles_path         = roles
collections_path   = collections

# --- Runtime ------------------------------------------------------------------
host_key_checking  = True
nocows             = 1
# Password + TOTP: one host at a time avoids overlapping authentications if
# the multiplexing socket is not yet established (serial: 1 is also set in
# site.yml, but forks applies to fact gathering and any play without serial).
forks              = 1
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout    = 7200
retry_files_enabled = False
force_handlers     = True
deprecation_warnings = True
interpreter_python  = auto_silent

# --- Output formatting (ansible-core >= 2.13) --------------------------------
# `default` is the only built-in stdout callback; YAML formatting is enabled
# through `callback_result_format = yaml` (replacement for the removed
# `community.general.yaml` callback). Profile/timer callbacks now live in
# ansible.posix and are referenced with their FQCN to avoid future name
# resolution surprises.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
callback_format_pretty = true
callbacks_enabled      = ansible.posix.profile_tasks,ansible.posix.timer

# --- Authentication policy ----------------------------------------------------
# Password + TOTP authentication: never assume any local key.
private_key_file =

[privilege_escalation]
become             = True
become_method      = sudo
become_ask_pass    = True

[ssh_connection]
pipelining          = False

# SSH multiplexing is REQUIRED for password + TOTP with Ansible: without it
# every task opens a new TCP connection + KEX + full PAM (password + TOTP),
# which can hit sshd MaxStartups, fail2ban, CrowdSec, etc. and yields:
#   kex_exchange_identification: read: Connection reset by peer
# With ControlMaster=auto, the first connection authenticates once; further
# ansible tasks reuse the authenticated master channel (no repeated TOTP).
control_path_dir    = ~/.ansible/cp

ssh_args = -o ControlMaster=auto -o ControlPersist=4h -o PreferredAuthentications=keyboard-interactive,password -o PubkeyAuthentication=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=30

# Transient RST during KEX / TLS middleboxes — retry a few times.
retries             = 5
timeout             = 60
