[defaults]
# Targets ansible-core >= 2.16 (LTS line) on the controller.
# See controller-requirements.txt and requirements.yml for pinned versions.

# --- Inventory + roles --------------------------------------------------------
inventory          = inventory/hosts.yml
roles_path         = roles
collections_path   = collections

# --- Runtime ------------------------------------------------------------------
host_key_checking  = True
nocows             = 1
forks              = 10
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout    = 7200
retry_files_enabled = False
force_handlers     = True
deprecation_warnings = True
interpreter_python  = auto_silent

# --- Output formatting (ansible-core >= 2.13) --------------------------------
# `default` is the only built-in stdout callback; YAML formatting is enabled
# through `callback_result_format = yaml` (replacement for the removed
# `community.general.yaml` callback). Profile/timer callbacks now live in
# ansible.posix and are referenced with their FQCN to avoid future name
# resolution surprises.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
callback_format_pretty = true
callbacks_enabled      = ansible.posix.profile_tasks,ansible.posix.timer

# --- Authentication policy ----------------------------------------------------
# Password + TOTP authentication: never assume any local key.
private_key_file =

[privilege_escalation]
become             = True
become_method      = sudo
become_ask_pass    = True

[ssh_connection]
# Two-factor SSH (password + TOTP) does NOT survive ControlMaster reuse:
# disable persistent connections so each task triggers a full PAM exchange.
pipelining       = False
ssh_args         = -o PreferredAuthentications=keyboard-interactive,password -o PubkeyAuthentication=no -o ControlMaster=no -o ServerAliveInterval=30
control_path     = none
retries          = 1
